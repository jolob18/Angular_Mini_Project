<div class="configure">
  <h1>Form Configuration</h1>

  <div class="gridContainer">
      <div class="gridHeader">
          <span class="left"><h6>SHOW FIELD</h6></span>
          <span class="right"><h6>REQUIRED FIELD</h6></span>
      </div>

      <div
          #wrapper
          kendoDragTargetContainer
          kendoDropTargetContainer
          dragTargetFilter=".form-body"
          dropTargetFilter=".form-body"
          dragTarget=".form-fields"
          dropTarget=".form-fields"
          [hint]="{ hintClass: 'rowHint' }"
          [dragData]="dragData"
          (onDrop)="onDrop($event)"
          class="wrapper-container"
      >
          <div class="form-body" *ngFor="let field of tempGridData; let i = index" [attr.data-index]="i">
              <div class="form-fields">
                  <input type="checkbox" [(ngModel)]="field.firstChecked" (change)="onFieldToggle(field)" />
                  <label>{{ field.name }}</label>
                  <input type="checkbox" [(ngModel)]="field.secondChecked" [disabled]="!field.firstChecked"  (change)="onRequiredFieldToggle()"/>
              </div>
   
          </div>
          <div *ngIf="stateError" class="error-message">
            Please select 'Country' before selecting 'State'.
        </div>

          <div class="button-container">
              <button (click)="saveChanges()" class="save-btn" [disabled]="stateError">Save Changes</button>
          </div>
      </div>
      
<p *ngIf="selectionError" class="error-message">{{ selectionError }}</p>
<p *ngIf="requiredError" class="error-message">{{ requiredError }}</p>
  </div>
</div>


<div *ngIf="showSuccessMessage" class="success-toast">
  Changes Saved
</div>
